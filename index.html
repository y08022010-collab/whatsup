<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Web Clone - Realtime Firebase Chat & Calls</title>
  
  <!-- FontAwesome Icons & PeerJS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #111b21; color: #e9edef; display: flex; height: 100vh; overflow: hidden; width: 100vw; }

    /* Login Screen */
    #login-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #111b21; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 9999;
    }
    .login-card {
      background: #202c33; padding: 40px; border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5); text-align: center; max-width: 400px; width: 90%;
    }
    .login-card h1 { color: #00a884; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .login-card p { color: #8696a0; margin-bottom: 30px; font-size: 14px; }
    .login-btn {
      background: #00a884; color: white; border: none; padding: 12px 24px;
      font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; transition: 0.2s;
    }
    .login-btn:hover { background: #008f6f; }

    /* Main WhatsApp Layout */
    #app-container { display: flex; width: 100%; height: 100%; }
    
    /* Left Sidebar */
    .sidebar { width: 350px; background: #111b21; border-right: 1px solid #222d34; display: flex; flex-direction: column; height: 100%; flex-shrink: 0; }
    .sidebar-header { height: 60px; background: #202c33; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    .user-profile { display: flex; align-items: center; gap: 10px; }
    .user-profile img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .user-profile span { font-weight: 600; font-size: 15px; }

    .add-contact-bar { padding: 10px 16px; background: #111b21; display: flex; gap: 8px; border-bottom: 1px solid #222d34; }
    .add-contact-bar input { flex: 1; background: #202c33; border: none; padding: 8px 12px; color: #fff; border-radius: 8px; outline: none; font-size: 14px; }
    .add-contact-bar button { background: #00a884; border: none; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; }

    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { display: flex; align-items: center; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #1f2c34; transition: 0.2s; position: relative; }
    .chat-item:hover, .chat-item.active { background: #2a3942; }
    .chat-item img { width: 45px; height: 45px; border-radius: 50%; margin-right: 12px; }
    .chat-info { flex: 1; overflow: hidden; }
    .chat-info h4 { font-size: 15px; color: #e9edef; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-info p { font-size: 13px; color: #8696a0; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-badge { font-size: 10px; padding: 3px 8px; border-radius: 12px; font-weight: 600; text-transform: uppercase; margin-left: 5px; }
    .status-pending { background: #d97706; color: white; }
    .status-accepted { background: #059669; color: white; }
    .status-incoming { background: #2563eb; color: white; }

    /* Right Main Chat Area */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #0b141a; position: relative; height: 100%; }
    .chat-header { height: 60px; background: #202c33; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #222d34; }
    .chat-header-user { display: flex; align-items: center; gap: 12px; }
    .chat-header-user img { width: 40px; height: 40px; border-radius: 50%; }
    .call-actions { display: flex; gap: 20px; font-size: 18px; color: #aebac1; }
    .call-actions i { cursor: pointer; transition: 0.2s; padding: 8px; border-radius: 50%; }
    .call-actions i:hover { color: #00a884; background: #2a3942; }

    .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: radial-gradient(#202c33 1px, transparent 0); background-size: 24px 24px; }
    .msg { max-width: 60%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-break: break-word; position: relative; }
    .msg.sent { background: #005c4b; color: #e9edef; align-self: flex-end; border-top-right-radius: 0; }
    .msg.received { background: #202c33; color: #e9edef; align-self: flex-start; border-top-left-radius: 0; }
    .msg-time { font-size: 10px; color: rgba(255,255,255,0.6); float: right; margin-top: 4px; margin-left: 10px; }

    .chat-input-bar { height: 62px; background: #202c33; display: flex; align-items: center; padding: 5px 16px; gap: 10px; }
    .chat-input-bar input { flex: 1; background: #2a3942; border: none; padding: 12px 16px; color: white; border-radius: 8px; outline: none; font-size: 15px; }
    .chat-input-bar button { background: transparent; border: none; color: #00a884; font-size: 20px; cursor: pointer; padding: 8px; }

    /* Incoming Call Ringing Dialog Modal */
    #incoming-call-modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); display: none;
      flex-direction: column; align-items: center; justify-content: center; z-index: 10000;
      animation: fadeIn 0.3s ease;
    }
    .incoming-card {
      background: #202c33; padding: 30px; border-radius: 16px; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 320px; border: 1px solid #00a884;
    }
    .caller-avatar { width: 90px; height: 90px; border-radius: 50%; margin: 15px auto; border: 3px solid #00a884; animation: pulse 1.5s infinite; }
    .incoming-actions { display: flex; justify-content: space-around; margin-top: 25px; }
    .btn-accept { background: #25d366; color: white; width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-decline { background: #ea4335; color: white; width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* Active Call Overlay */
    #call-screen {
      position: absolute; inset: 0; background: #111b21; display: none;
      flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
    }
    .video-grid { display: flex; width: 90%; height: 75%; gap: 15px; justify-content: center; align-items: center; }
    video { width: 48%; height: 100%; object-fit: cover; border-radius: 12px; background: #000; border: 2px solid #202c33; }
    .call-controls { margin-top: 25px; display: flex; gap: 20px; }
    .call-btn { width: 55px; height: 55px; border-radius: 50%; border: none; color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-end { background: #ea4335; }
    .btn-end:hover { background: #dc2626; }
    .btn-mute { background: #3c4043; }
    .btn-mute:hover { background: #4b5563; }

    .request-box { background: #202c33; padding: 16px; border-radius: 8px; margin: 20px auto; text-align: center; border: 1px solid #00a884; max-width: 80%; }
    .request-box p { margin-bottom: 12px; color: #e9edef; font-size: 15px; }
    .request-box button { background: #00a884; border: none; color: white; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
    
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 168, 132, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(0, 168, 132, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 168, 132, 0); }
    }
  </style>
</head>
<body>

  <!-- 1. Google Login Screen -->
  <div id="login-screen">
    <div class="login-card">
      <h1><i class="fa-brands fa-whatsapp"></i> WhatsApp</h1>
      <p>આગળ વધવા માટે Google એકાઉન્ટથી લોગિન કરો</p>
      <button class="login-btn" onclick="loginWithGoogle()">
        <i class="fa-brands fa-google"></i> Google Sign In
      </button>
    </div>
  </div>

  <!-- 2. Main Interface -->
  <div id="app-container">
    
    <!-- Left Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="user-profile">
          <img id="my-avatar" src="https://via.placeholder.com/40" alt="Avatar">
          <span id="my-name">User</span>
        </div>
        <i class="fa-solid fa-right-from-bracket" style="cursor:pointer; color:#aebac1;" onclick="logout()" title="Logout"></i>
      </div>

      <!-- Add Friend Request via Email -->
      <div class="add-contact-bar">
        <input type="email" id="request-email" placeholder="Gmail ID લખો...">
        <button onclick="sendFriendRequest()" title="Request મોકલો"><i class="fa-solid fa-paper-plane"></i></button>
      </div>

      <!-- Friend / Chat List -->
      <div class="chat-list" id="chat-list"></div>
    </div>

    <!-- Right Chat Area -->
    <div class="chat-area">
      <div class="chat-header">
        <div class="chat-header-user">
          <img id="active-user-img" src="https://via.placeholder.com/40" alt="Active Chat">
          <div>
            <h4 id="active-user-name">કોઈ મિત્ર પસંદ કરો</h4>
            <p style="font-size: 12px; color: #8696a0;" id="active-user-status">ઓફલાઇન</p>
          </div>
        </div>
        <!-- Calling Buttons -->
        <div class="call-actions">
          <i class="fa-solid fa-phone" onclick="startCall('audio')" title="Voice Call"></i>
          <i class="fa-solid fa-video" onclick="startCall('video')" title="Video Call"></i>
        </div>
      </div>

      <!-- Message Container -->
      <div class="messages-container" id="messages-container">
        <div style="text-align: center; color: #8696a0; margin-top: 50px;" id="welcome-text">
          <i class="fa-brands fa-whatsapp" style="font-size: 60px; margin-bottom: 15px; color: #202c33;"></i>
          <p>વાતચીત શરૂ કરવા માટે ડાબી બાજુથી Contact પસંદ કરો અથવા Request મોકલો.</p>
        </div>
      </div>

      <!-- Chat Input -->
      <div class="chat-input-bar">
        <input type="text" id="message-input" placeholder="સંદેશ લખો..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>

      <!-- Incoming Call Dialog Modal (Ringing UI) -->
      <div id="incoming-call-modal">
        <div class="incoming-card">
          <h3 style="color:#00a884;">ઇનકમિંગ કૉલ...</h3>
          <img id="caller-img" class="caller-avatar" src="https://via.placeholder.com/90" alt="Caller">
          <h4 id="caller-name" style="color:#e9edef; font-size:18px;">ઉપયોગકર્તા</h4>
          <p id="call-type-label" style="color:#8696a0; font-size:13px; margin-top:4px;">Video Call</p>
          
          <div class="incoming-actions">
            <button class="btn-decline" onclick="declineCall()"><i class="fa-solid fa-phone-slash"></i></button>
            <button class="btn-accept" onclick="acceptCall()"><i class="fa-solid fa-phone"></i></button>
          </div>
        </div>
      </div>

      <!-- Video / Voice Call Screen Overlay -->
      <div id="call-screen">
        <div class="video-grid">
          <video id="local-video" autoplay muted></video>
          <video id="remote-video" autoplay></video>
        </div>
        <div class="call-controls">
          <button class="call-btn btn-mute" onclick="toggleMute()"><i class="fa-solid fa-microphone"></i></button>
          <button class="call-btn btn-end" onclick="endCall()"><i class="fa-solid fa-phone-slash"></i></button>
        </div>
      </div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, get, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase configuration with Realtime Database URL
    const firebaseConfig = {
      apiKey: "AIzaSyCj8m-OEy3fZYEyeIkdu9HLmLVkQjsvJtM",
      authDomain: "whatsup-37cb2.firebaseapp.com",
      projectId: "whatsup-37cb2",
      storageBucket: "whatsup-37cb2.firebasestorage.app",
      messagingSenderId: "290942646356",
      appId: "1:290942646356:web:cf1ac9b54f9d8cda36d5c1",
      measurementId: "G-Q86QQ38RQ0",
      databaseURL: "https://whatsup-37cb2-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let peer = null;
    let currentCall = null;
    let localStream = null;
    let activeChatUser = null;
    let friendsList = {};
    let incomingCallData = null;
    let audioContext = null;
    let ringtoneInterval = null;

    function sanitizeKey(key) {
      return key ? key.replace(/[.#$/\[\]]/g, "_") : "";
    }

    // Web Audio Ringing Synthesizer (Zero External Dependencies)
    function playRingtone() {
      try {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();

        const playTone = () => {
          if (!audioContext) return;
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, audioContext.currentTime); // Standard ring frequency
          gain.gain.setValueAtTime(0.1, audioContext.currentTime);
          osc.connect(gain);
          gain.connect(audioContext.destination);
          osc.start();
          osc.stop(audioContext.currentTime + 1.2);
        };

        playTone();
        ringtoneInterval = setInterval(playTone, 2500);
      } catch (e) {
        console.log("Ringtone error:", e);
      }
    }

    function stopRingtone() {
      if (ringtoneInterval) {
        clearInterval(ringtoneInterval);
        ringtoneInterval = null;
      }
    }

    window.loginWithGoogle = () => {
      signInWithPopup(auth, provider).catch(error => alert("Login Error: " + error.message));
    };

    window.logout = () => {
      if(currentUser) {
        set(ref(db, 'users/' + sanitizeKey(currentUser.email) + '/status'), 'offline');
      }
      signOut(auth).then(() => {
        document.getElementById('login-screen').style.display = 'flex';
      });
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        handleUserLogin(user);
      } else {
        document.getElementById('login-screen').style.display = 'flex';
      }
    });

    function handleUserLogin(user) {
      currentUser = user;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('my-avatar').src = user.photoURL || 'https://via.placeholder.com/40';
      document.getElementById('my-name').innerText = user.displayName || 'User';

      const userEmailKey = sanitizeKey(user.email);

      // Save active user info in Firebase Database
      set(ref(db, 'users/' + userEmailKey), {
        uid: user.uid,
        name: user.displayName,
        email: user.email,
        photoURL: user.photoURL,
        status: 'online'
      });

      initPeerJS(user.uid);
      listenForFriendsAndRequests();
      listenForIncomingCalls();
    }

    function initPeerJS(userId) {
      const cleanId = userId.replace(/[^a-zA-Z0-9]/g, "");
      peer = new Peer(cleanId);

      peer.on('call', (call) => {
        currentCall = call;
        call.on('stream', remoteStream => {
          document.getElementById('remote-video').srcObject = remoteStream;
        });
      });
    }

    // Realtime Incoming Call Signal Listener
    function listenForIncomingCalls() {
      const myEmailKey = sanitizeKey(currentUser.email);
      const callRef = ref(db, 'calls/' + myEmailKey);

      onValue(callRef, (snapshot) => {
        const callData = snapshot.val();

        if (callData && callData.status === 'ringing') {
          incomingCallData = callData;
          
          // Show Ringing Call Modal UI
          document.getElementById('caller-img').src = callData.callerPhoto || 'https://via.placeholder.com/90';
          document.getElementById('caller-name').innerText = callData.callerName || callData.callerEmail;
          document.getElementById('call-type-label').innerText = `${callData.type === 'video' ? 'Video' : 'Voice'} Call...`;
          document.getElementById('incoming-call-modal').style.display = 'flex';
          
          playRingtone();
        } else if (!callData || callData.status === 'ended' || callData.status === 'declined') {
          stopRingtone();
          document.getElementById('incoming-call-modal').style.display = 'none';
          if (callData && callData.status === 'declined' && currentCall) {
            alert("સામેવાળા યુઝરે કૉલ રદ (Decline) કર્યો છે.");
            endCall();
          }
        }
      });
    }

    // Accept Incoming Call
    window.acceptCall = () => {
      stopRingtone();
      document.getElementById('incoming-call-modal').style.display = 'none';
      document.getElementById('call-screen').style.display = 'flex';

      const myEmailKey = sanitizeKey(currentUser.email);
      update(ref(db, 'calls/' + myEmailKey), { status: 'accepted' });

      const isVideo = incomingCallData ? (incomingCallData.type === 'video') : true;

      navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true }).then(stream => {
        localStream = stream;
        document.getElementById('local-video').srcObject = stream;

        if (currentCall) {
          currentCall.answer(stream);
        }
      }).catch(err => alert("કેમેરા/માઇક્રોફોન ચાલુ કરવામાં ભૂલ: " + err.message));
    };

    // Decline Incoming Call
    window.declineCall = () => {
      stopRingtone();
      document.getElementById('incoming-call-modal').style.display = 'none';

      if (incomingCallData) {
        const myEmailKey = sanitizeKey(currentUser.email);
        const callerEmailKey = sanitizeKey(incomingCallData.callerEmail);

        // Notify both parties that call was declined
        update(ref(db, 'calls/' + myEmailKey), { status: 'declined' });
        update(ref(db, 'calls/' + callerEmailKey), { status: 'declined' });

        setTimeout(() => {
          remove(ref(db, 'calls/' + myEmailKey));
          remove(ref(db, 'calls/' + callerEmailKey));
        }, 1000);
      }
    };

    function listenForFriendsAndRequests() {
      const myEmailKey = sanitizeKey(currentUser.email);
      const friendsRef = ref(db, 'friends/' + myEmailKey);

      onValue(friendsRef, (snapshot) => {
        friendsList = snapshot.val() || {};
        renderFriendList();
      });
    }

    function renderFriendList() {
      const chatList = document.getElementById('chat-list');
      chatList.innerHTML = '';

      Object.keys(friendsList).forEach(friendEmailKey => {
        const item = friendsList[friendEmailKey];
        const div = document.createElement('div');
        div.className = 'chat-item';
        div.onclick = () => selectContact(friendEmailKey, item);

        let statusText = 'Pending';
        let badgeClass = 'status-pending';

        if (item.status === 'accepted') {
          statusText = 'Accepted';
          badgeClass = 'status-accepted';
        } else if (item.status === 'incoming') {
          statusText = 'New Request';
          badgeClass = 'status-incoming';
        }

        div.innerHTML = `
          <img src="${item.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(item.name) + '&background=random'}" alt="">
          <div class="chat-info">
            <h4>${item.name || item.email}</h4>
            <p>${item.email}</p>
          </div>
          <span class="status-badge ${badgeClass}">${statusText}</span>
        `;
        chatList.appendChild(div);
      });
    }

    window.sendFriendRequest = async () => {
      const emailInput = document.getElementById('request-email');
      const friendEmail = emailInput.value.trim().toLowerCase();
      
      if (!friendEmail) return alert("કૃપા કરીને પહેલા Gmail લખો.");
      if (friendEmail === currentUser.email.toLowerCase()) return alert("તમે તમારી પોતાની આઈડી પર રિક્વેસ્ટ મોકલી શકતા નથી.");

      const targetEmailKey = sanitizeKey(friendEmail);
      const myEmailKey = sanitizeKey(currentUser.email);

      const userSnap = await get(ref(db, 'users/' + targetEmailKey));
      
      if (!userSnap.exists()) {
        alert("આ Gmail વાળા યુઝરે હજી સુધી આ એપ્લિકેશનમાં Google Login કરેલું નથી.");
        return;
      }

      const targetUser = userSnap.val();

      set(ref(db, `friends/${myEmailKey}/${targetEmailKey}`), {
        email: targetUser.email,
        name: targetUser.name,
        photoURL: targetUser.photoURL,
        uid: targetUser.uid,
        status: 'pending'
      });

      set(ref(db, `friends/${targetEmailKey}/${myEmailKey}`), {
        email: currentUser.email,
        name: currentUser.displayName,
        photoURL: currentUser.photoURL,
        uid: currentUser.uid,
        status: 'incoming'
      });

      emailInput.value = "";
      alert("રિક્વેસ્ટ મોકલાઈ ગઈ છે!");
    };

    function selectContact(friendEmailKey, item) {
      activeChatUser = { ...item, key: friendEmailKey };
      document.getElementById('active-user-name').innerText = item.name || item.email;
      document.getElementById('active-user-img').src = item.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(item.name)}&background=random`;

      const container = document.getElementById('messages-container');
      container.innerHTML = '';

      if (item.status === 'incoming') {
        document.getElementById('active-user-status').innerText = "Request Received";
        container.innerHTML = `
          <div class="request-box">
            <p><strong>${item.name || item.email}</strong> એ તમને મિત્ર બનાવવાની રિક્વેસ્ટ મોકલી છે.</p>
            <button onclick="acceptFriendRequest('${friendEmailKey}')">Accept Request</button>
          </div>
        `;
      } else if (item.status === 'pending') {
        document.getElementById('active-user-status').innerText = "Request Pending";
        container.innerHTML = `
          <div class="request-box">
            <p>તમે રિક્વેસ્ટ મોકલી દીધી છે. સામેવાળી વ્યક્તિ સ્વીકારે ત્યાં સુધી રાહ જુઓ.</p>
          </div>
        `;
      } else {
        document.getElementById('active-user-status').innerText = "Online";
        listenForMessages(friendEmailKey);
      }
    }

    window.acceptFriendRequest = (friendEmailKey) => {
      const myEmailKey = sanitizeKey(currentUser.email);

      update(ref(db, `friends/${myEmailKey}/${friendEmailKey}`), { status: 'accepted' });
      update(ref(db, `friends/${friendEmailKey}/${myEmailKey}`), { status: 'accepted' });

      alert("રિક્વેસ્ટ સ્વીકારી લેવામાં આવી છે!");
    };

    function getChatRoomId(key1, key2) {
      return key1 < key2 ? `${key1}_${key2}` : `${key2}_${key1}`;
    }

    function listenForMessages(friendEmailKey) {
      const myEmailKey = sanitizeKey(currentUser.email);
      const roomId = getChatRoomId(myEmailKey, friendEmailKey);
      const chatRef = ref(db, 'chats/' + roomId);

      onValue(chatRef, (snapshot) => {
        const container = document.getElementById('messages-container');
        container.innerHTML = '';
        const data = snapshot.val();

        if (data) {
          Object.values(data).forEach(msg => {
            const msgDiv = document.createElement('div');
            const isMe = msg.sender === currentUser.email;
            msgDiv.className = `msg ${isMe ? 'sent' : 'received'}`;
            msgDiv.innerHTML = `${msg.text} <span class="msg-time">${msg.time}</span>`;
            container.appendChild(msgDiv);
          });
          container.scrollTop = container.scrollHeight;
        }
      });
    }

    window.sendMessage = () => {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !activeChatUser) return;

      if (activeChatUser.status !== 'accepted') {
        alert("રિક્વેસ્ટ એક્સેપ્ટ ના થાય ત્યાં સુધી મેસેજ મોકલી શકાશે નહીં.");
        return;
      }

      const myEmailKey = sanitizeKey(currentUser.email);
      const roomId = getChatRoomId(myEmailKey, activeChatUser.key);
      const newMsgRef = push(ref(db, 'chats/' + roomId));

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      set(newMsgRef, {
        sender: currentUser.email,
        text: text,
        time: time,
        timestamp: Date.now()
      });

      input.value = "";
    };

    window.handleKeyPress = (e) => {
      if (e.key === 'Enter') sendMessage();
    };

    window.startCall = (type) => {
      if (!activeChatUser || activeChatUser.status !== 'accepted') {
        alert("કોલ કરવા માટે પહેલા રિક્વેસ્ટ Accept થવી જરૂરી છે.");
        return;
      }

      const isVideo = (type === 'video');
      const myEmailKey = sanitizeKey(currentUser.email);
      const targetEmailKey = activeChatUser.key;

      // 1. Send Ringing Signal to Target User in Firebase Realtime DB
      set(ref(db, 'calls/' + targetEmailKey), {
        callerEmail: currentUser.email,
        callerName: currentUser.displayName,
        callerPhoto: currentUser.photoURL,
        type: type,
        status: 'ringing',
        timestamp: Date.now()
      });

      document.getElementById('call-screen').style.display = 'flex';

      // 2. Start Local Stream & Peer Connection
      navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true }).then(stream => {
        localStream = stream;
        document.getElementById('local-video').srcObject = stream;

        const cleanFriendUid = activeChatUser.uid.replace(/[^a-zA-Z0-9]/g, "");
        const call = peer.call(cleanFriendUid, stream);
        currentCall = call;

        call.on('stream', remoteStream => {
          document.getElementById('remote-video').srcObject = remoteStream;
        });
      }).catch(err => {
        alert("કેમેરા/માઇક્રોફોન શરૂ કરવામાં એરર: " + err.message);
      });
    };

    window.endCall = () => {
      stopRingtone();
      if (currentCall) currentCall.close();
      if (localStream) localStream.getTracks().forEach(track => track.stop());

      if (activeChatUser) {
        const targetEmailKey = activeChatUser.key;
        const myEmailKey = sanitizeKey(currentUser.email);

        remove(ref(db, 'calls/' + targetEmailKey));
        remove(ref(db, 'calls/' + myEmailKey));
      }

      document.getElementById('call-screen').style.display = 'none';
      document.getElementById('incoming-call-modal').style.display = 'none';
    };

    window.toggleMute = () => {
      if (localStream) {
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
          audioTrack.enabled = !audioTrack.enabled;
          alert(audioTrack.enabled ? "માઇક ચાલુ થયું" : "માઇક મ્યુટ થયું");
        }
      }
    };
  </script>
</body>
</html>
